<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" role="img" aria-label="Illustration of a small-town market street: three shop stalls with striped cloth awnings, crates of vegetables, sacks, a hand cart and a cycle rickshaw, with a few shoppers. The signboards are deliberately blank.">
  <title>Illustrated market street with shop stalls and awnings</title>
  <desc>A flat editorial illustration in terracotta, marigold, indigo and cream. It depicts a generic market street, not the actual layout of ICHHAPUR market. The stall signboards are left blank on purpose so that no shop name is invented.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf8ee"/>
      <stop offset=".55" stop-color="#f7e9d3"/>
      <stop offset="1" stop-color="#f0dcc0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9d3b1"/>
      <stop offset="1" stop-color="#dcc09a"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1c12" stop-opacity=".16"/>
      <stop offset="1" stop-color="#2a1c12" stop-opacity="0"/>
    </linearGradient>

    <!-- one tile = two awning stripes with a scalloped hem; tiled by pattern -->
    <pattern id="awnA" patternUnits="userSpaceOnUse" width="52" height="24">
      <path d="M0 0h26v9q-13 14-26 0z" fill="#a93b22"/>
      <path d="M26 0h26v9q-13 14-26 0z" fill="#fbf3e7"/>
    </pattern>
    <pattern id="awnB" patternUnits="userSpaceOnUse" width="52" height="24">
      <path d="M0 0h26v9q-13 14-26 0z" fill="#1e3557"/>
      <path d="M26 0h26v9q-13 14-26 0z" fill="#e8a33d"/>
    </pattern>
    <pattern id="awnC" patternUnits="userSpaceOnUse" width="52" height="24">
      <path d="M0 0h26v9q-13 14-26 0z" fill="#2c6b4e"/>
      <path d="M26 0h26v9q-13 14-26 0z" fill="#fbf3e7"/>
    </pattern>

    <!-- reusable stall: posts, wall, dark interior, counter -->
    <g id="stall">
      <rect x="0" y="36" width="18" height="248" rx="4" fill="#8a5a00"/>
      <rect x="302" y="36" width="18" height="248" rx="4" fill="#8a5a00"/>
      <rect x="14" y="36" width="292" height="248" fill="#f3e6d2"/>
      <rect x="14" y="36" width="292" height="60" fill="#e6d2b4"/>
      <rect x="46" y="96" width="228" height="188" rx="6" fill="#2a1c12" opacity=".82"/>
      <rect x="46" y="96" width="228" height="188" rx="6" fill="none" stroke="#8a5a00" stroke-width="4"/>
      <rect x="30" y="214" width="260" height="18" rx="5" fill="#a93b22"/>
      <rect x="30" y="232" width="260" height="52" rx="4" fill="#c07a2c"/>
      <rect x="30" y="232" width="260" height="52" rx="4" fill="none" stroke="#8a5a00" stroke-width="3"/>
    </g>
  </defs>

  <!-- sky, sun, birds -->
  <rect width="1200" height="760" fill="url(#sky)"/>
  <circle cx="1004" cy="132" r="74" fill="#e8a33d" opacity=".34"/>
  <circle cx="1004" cy="132" r="40" fill="#e8a33d" opacity=".4"/>
  <g fill="none" stroke="#5b4432" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M150 96q14-13 27 0 13-13 27 0"/>
    <path d="M242 62q11-10 21 0 10-10 21 0"/>
    <path d="M846 78q12-11 23 0 11-11 23 0"/>
  </g>

  <!-- distant treeline -->
  <g opacity=".2" fill="#1e3557">
    <path d="M0 470c60-26 96 6 148-14 54-22 86 12 140-6 62-22 96 16 156-2 58-18 92 14 148-2 54-16 88 14 142 0 52-14 86 12 140 0 48-10 82 10 126 2v70H0z"/>
    <path d="M96 470c-6-30 4-52 22-64-24 2-42-10-52-30 22 12 42 8 56-6-8 24 4 42 20 52 10-30-4-58-24-72 30 4 52 26 58 56 4-26-4-46-16-60 26 12 42 38 42 72 0 26-8 42-14 54z"/>
    <path d="M1084 470c-8-34 2-58 24-72-28 2-48-12-60-36 26 14 48 10 66-8-10 28 4 48 24 60 10-36-6-66-28-82 36 6 60 32 66 66 4-30-4-52-18-68 30 14 48 44 48 82 0 30-10 48-16 58z"/>
  </g>

  <!-- ground -->
  <rect y="560" width="1200" height="200" fill="url(#ground)"/>
  <rect y="560" width="1200" height="46" fill="url(#shade)"/>
  <g stroke="#c9a97e" stroke-width="3" stroke-linecap="round" opacity=".7" fill="none">
    <path d="M60 664h180M320 700h240M660 648h150M880 690h220M120 726h140M700 730h180"/>
  </g>

  <!-- back row of smaller stalls -->
  <g opacity=".45">
    <rect x="120" y="330" width="150" height="120" fill="#dcc09a"/>
    <rect x="112" y="312" width="166" height="20" rx="6" fill="#1e3557"/>
    <rect x="420" y="342" width="130" height="108" fill="#dcc09a"/>
    <rect x="412" y="324" width="146" height="20" rx="6" fill="#a93b22"/>
    <rect x="900" y="336" width="150" height="114" fill="#dcc09a"/>
    <rect x="892" y="318" width="166" height="20" rx="6" fill="#2c6b4e"/>
  </g>

  <!-- STALL A -->
  <g>
    <rect x="78" y="248" width="364" height="44" rx="8" fill="#fdf8ee" stroke="#a93b22" stroke-width="5"/>
    <use href="#stall" x="90" y="288"/>
    <rect x="78" y="300" width="364" height="24" fill="url(#awnA)"/>
    <rect x="78" y="296" width="364" height="8" rx="4" fill="#8a2e19"/>
    <!-- produce on the counter -->
    <g>
      <rect x="52" y="500" width="86" height="58" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <circle cx="74" cy="500" r="15" fill="#a93b22"/><circle cx="104" cy="497" r="17" fill="#e8a33d"/>
      <circle cx="128" cy="502" r="13" fill="#a93b22"/>
      <rect x="152" y="510" width="78" height="48" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <g fill="#2c6b4e"><ellipse cx="172" cy="508" rx="13" ry="8"/><ellipse cx="196" cy="504" rx="14" ry="8"/><ellipse cx="216" cy="510" rx="11" ry="7"/></g>
      <rect x="244" y="496" width="92" height="62" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <g fill="#e8a33d"><circle cx="266" cy="496" r="14"/><circle cx="292" cy="492" r="16"/><circle cx="318" cy="498" r="12"/></g>
    </g>
  </g>

  <!-- STALL B -->
  <g>
    <use href="#stall" x="468" y="306"/>
    <rect x="468" y="318" width="312" height="24" fill="url(#awnB)"/>
    <rect x="468" y="314" width="312" height="8" rx="4" fill="#16273f"/>
    <g>
      <rect x="430" y="512" width="80" height="46" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <g fill="#8a2e19"><circle cx="450" cy="510" r="11"/><circle cx="472" cy="507" r="12"/><circle cx="494" cy="511" r="10"/></g>
      <!-- stacked gunny sacks -->
      <g fill="#e6d2b4" stroke="#a98b5f" stroke-width="3">
        <path d="M530 558v-46c0-14 12-22 28-22s28 8 28 22v46z"/>
        <path d="M540 512c-4-16 6-28 22-28s26 12 22 28z"/>
      </g>
      <g fill="#2c6b4e"><ellipse cx="600" cy="540" rx="16" ry="9"/><ellipse cx="628" cy="534" rx="17" ry="9"/></g>
      <rect x="576" y="544" width="72" height="14" rx="5" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
    </g>
  </g>

  <!-- STALL C -->
  <g>
    <rect x="806" y="266" width="364" height="44" rx="8" fill="#fdf8ee" stroke="#2c6b4e" stroke-width="5"/>
    <use href="#stall" x="818" y="300"/>
    <rect x="806" y="312" width="364" height="24" fill="url(#awnC)"/>
    <rect x="806" y="308" width="364" height="8" rx="4" fill="#1d4d37"/>
    <!-- hanging goods -->
    <g stroke="#8a5a00" stroke-width="2" fill="none">
      <path d="M850 340v34M900 340v46M950 340v30M1000 340v44M1050 340v34"/>
    </g>
    <g fill="#e8a33d">
      <path d="M838 374h24l-4 30h-16z"/><path d="M988 384h24l-4 30h-16z"/>
    </g>
    <g fill="#a93b22">
      <path d="M888 386h24l-4 34h-16z"/><path d="M1038 374h24l-4 30h-16z"/>
    </g>
    <path d="M938 370h24l-4 28h-16z" fill="#2c6b4e"/>
    <g>
      <rect x="880" y="506" width="96" height="52" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <g fill="#1e3557"><ellipse cx="902" cy="504" rx="13" ry="9"/><ellipse cx="928" cy="500" rx="14" ry="9"/><ellipse cx="954" cy="505" rx="12" ry="8"/></g>
      <rect x="996" y="514" width="88" height="44" rx="6" fill="#c07a2c" stroke="#8a5a00" stroke-width="3"/>
      <g fill="#e8a33d"><circle cx="1016" cy="512" r="11"/><circle cx="1040" cy="509" r="12"/><circle cx="1064" cy="513" r="10"/></g>
    </g>
  </g>

  <!-- hand cart -->
  <g>
    <rect x="596" y="606" width="150" height="42" rx="6" fill="#a93b22"/>
    <rect x="596" y="606" width="150" height="10" fill="#8a2e19"/>
    <path d="M746 622h34v-30" fill="none" stroke="#5b4432" stroke-width="7" stroke-linecap="round"/>
    <circle cx="644" cy="670" r="26" fill="none" stroke="#2a1c12" stroke-width="7"/>
    <circle cx="644" cy="670" r="5" fill="#2a1c12"/>
    <g stroke="#5b4432" stroke-width="3"><path d="M644 646v48M620 670h48M627 653l34 34M661 653l-34 34"/></g>
  </g>

  <!-- cycle rickshaw -->
  <g>
    <circle cx="238" cy="672" r="34" fill="none" stroke="#2a1c12" stroke-width="8"/>
    <circle cx="356" cy="678" r="24" fill="none" stroke="#2a1c12" stroke-width="7"/>
    <g stroke="#2a1c12" stroke-width="4" fill="none"><path d="M238 638v68M204 672h68M214 648l48 48M262 648l-48 48"/></g>
    <path d="M262 664h74l16-46h-58z" fill="#1e3557"/>
    <path d="M286 618q30-46 70-30 26 10 20 34z" fill="#a93b22"/>
    <path d="M352 618q22 4 26 26" fill="none" stroke="#5b4432" stroke-width="6" stroke-linecap="round"/>
    <path d="M262 664l-24 14" stroke="#5b4432" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- shoppers, no faces -->
  <g fill="#2a1c12">
    <g opacity=".9">
      <circle cx="430" cy="600" r="17"/>
      <path d="M430 619c-24 0-38 18-40 44l-6 60h92l-6-60c-2-26-16-44-40-44z"/>
      <path d="M470 646l26 10-14 40-24-12z" fill="#a93b22"/>
    </g>
    <g opacity=".82">
      <circle cx="820" cy="612" r="16"/>
      <path d="M820 630c-22 0-35 17-37 42l-6 56h86l-6-56c-2-25-15-42-37-42z" fill="#1e3557"/>
      <path d="M858 660l24 8-12 36-22-10z" fill="#e8a33d"/>
    </g>
    <g opacity=".7">
      <circle cx="1078" cy="628" r="14"/>
      <path d="M1078 644c-19 0-30 14-32 36l-5 48h74l-5-48c-2-22-13-36-32-36z"/>
    </g>
  </g>

  <!-- foreground shadow + warm haze -->
  <ellipse cx="600" cy="742" rx="560" ry="26" fill="#2a1c12" opacity=".08"/>
  <rect y="700" width="1200" height="60" fill="#e8a33d" opacity=".1"/>
</svg>
